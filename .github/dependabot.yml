# Daily. Version updates wait out a 3-day cooldown (a release has to be 3
# days old, so a compromised or broken one can be caught and yanked first);
# security updates skip it. The root module is standard library only, so
# its gomod entry has nothing to bump today; it's here so a dependency added
# later is covered from the start. telemetry is its own module (the
# OpenTelemetry dependencies), grouped so one release train is one PR.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3

  - package-ecosystem: "gomod"
    directory: "/telemetry"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    groups:
      opentelemetry:
        patterns: ["go.opentelemetry.io/*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
