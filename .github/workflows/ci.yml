name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Run the Go setup-go installed; never download another toolchain.
  GOTOOLCHAIN: local
  # Every Go module in the repository: the root (standard library only)
  # and telemetry (its own go.mod, for the OpenTelemetry dependencies).
  MODULES: ". telemetry"

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.27.4"
          cache: false # small modules; nothing worth caching
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "::error::not gofmt'd: $out"; exit 1; }
      - name: vet
        run: for m in $MODULES; do (cd "$m" && go vet ./...) || exit 1; done

  # Both architectures the services run on, with the services' Go (their
  # golang build image).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.27.4"
          cache: false # small modules; nothing worth caching
      - run: go version
      - name: test
        run: for m in $MODULES; do (cd "$m" && go test -race -count=1 ./...) || exit 1; done

  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      # Pinned by version and bumped by hand (Dependabot doesn't see it),
      # until the shared sadbox/ci workflows take this job over.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          for m in $MODULES; do (cd "$m" && "$(go env GOPATH)/bin/govulncheck" ./...) || exit 1; done

  # sadbox/ci's linters (actionlint, zizmor, and whichever others apply)
  # and the lockfile check, gh actions-lock --verify.
  linters:
    uses: sadbox/ci/.github/workflows/lint.yml@f3098bcadaa3401017253eebe9e9f6bb19febd5b # v0.1.2
    permissions:
      contents: read
