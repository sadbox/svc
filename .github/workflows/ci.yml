name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # sadbox/ci's Go checks (gofmt, go vet, go test -race, golangci-lint,
  # govulncheck) on linux/amd64 and linux/arm64, in setup-go mode: a
  # library has no build image. Every Go module in the repository: the
  # root (standard library only) and telemetry (its own go.mod, for the
  # OpenTelemetry dependencies). The services' Go (their golang build
  # image), not go.mod's minimum.
  go:
    uses: sadbox/ci/.github/workflows/go.yml@d22f8f95bcc884ba539ce3f53c552823cff3230d # v0.6.0
    permissions:
      contents: read
    with:
      go-versions: '["1.27.4"]'
      modules: ". telemetry"
      go-test-flags: "-count=1"

  # sadbox/ci's linters (actionlint, zizmor, and whichever others apply)
  # and the lockfile check, gh actions-lock --verify.
  lint:
    uses: sadbox/ci/.github/workflows/lint.yml@fbff0f9c424ef3ce793702959ecd1e858861d4b0 # v0.5.0
    permissions:
      contents: read
